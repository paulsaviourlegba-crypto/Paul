{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-card card shadow-sm mx-auto p-4">
 <h3 class="mb-3">Transportation System Login</h3>
 <p class="text-muted">Sign in with your authorised account.</p>
 <form method="post">{% csrf_token %}
  {% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}
  <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
  <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
  <button class="btn btn-primary w-100">Login</button>
 </form>
</div>
{% endblock %}
